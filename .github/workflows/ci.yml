# Runs the test suites defined in pom.xml (see docs/testing.md).
# Both jobs are required status checks for merging into main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR (or to main) cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, mocks, HTTP client, web slice and architecture tests. No Docker.
      - name: Run fast suite
        run: ./mvnw -B -ntp test -Pfast

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-fast
          path: target/surefire-reports/
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Persistence, flow and smoke tests. Testcontainers uses the runner's Docker.
      - name: Run integration suite
        run: ./mvnw -B -ntp test -Pintegration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-integration
          path: target/surefire-reports/
          retention-days: 7
