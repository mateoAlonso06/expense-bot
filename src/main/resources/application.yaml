spring:
  application:
    name: expense-bot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense-app}
    username: ${DB_USERNAME:mateo-local}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/expense-bot}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

telegram:
  # webhook (prod) or polling (dev); polling needs TELEGRAM_BOT_TOKEN
  mode: ${TELEGRAM_MODE:webhook}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  webhook:
    secret-token: ${TELEGRAM_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
