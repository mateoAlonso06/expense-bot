spring:
  application:
    name: expense-bot
  mvc:
    problemdetails:
      enabled: true # Spring's own errors (invalid body, failed validation) answer as RFC 9457 problem details

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense-app}
    username: ${DB_USERNAME:mateo-local}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/expense-bot}
          # only tokens whose "aud" claim names this API are accepted (tokens minted for other realm clients are not)
          audiences: ${KEYCLOAK_API_AUDIENCE:expense-bot-api}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # the model used by every ChatClient; it can be overridden per request in code
        model: gpt-4o-mini
        # extraction should be repeatable: the same message gives the same answer
        temperature: 0.0

cors:
  # origins (scheme + host + port) whose browser pages may call the API, comma-separated
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

accounts:
  link-code:
    # how long a link code stays valid
    ttl: 10m

conversation:
  clarification:
    # how long the bot waits for the answer to a question about an expense (a missing or ambiguous amount)
    ttl: 10m
  correction:
    # how far back a chat correction ("no, eran 15500") looks for the expense it changes, counted from when it was
    # stored; older expenses are edited from the web panel
    window: 30m

telegram:
  # webhook (prod) or polling (dev); polling needs TELEGRAM_BOT_TOKEN
  mode: ${TELEGRAM_MODE:webhook}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  webhook:
    # public HTTPS base URL of this app (webhook mode only); the endpoint path is appended
    url: ${TELEGRAM_WEBHOOK_URL:}
    secret-token: ${TELEGRAM_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
